# Thème de l'application — à placer dans .streamlit/config.toml
#
# Deux thèmes sont définis : l'utilisateur bascule de l'un à l'autre depuis
# le menu « ⋮ » (en haut à droite) → Settings → Theme.
# C'est la seule méthode qui agit sur TOUTE l'interface, y compris les
# tableaux, qui sont dessinés en canvas et échappent au CSS.

[theme]
base = "dark"                       # thème appliqué par défaut
primaryColor = "#E8A33D"            # ambre : boutons principaux, éléments actifs
font = "sans serif"

[theme.dark]
backgroundColor = "#14161A"
secondaryBackgroundColor = "#1C1F26"
textColor = "#E8E6E3"

[theme.light]
backgroundColor = "#FAF9F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2124"

[server]
maxUploadSize = 25                  # 5 photos de rapport : 25 Mo suffisent largement
